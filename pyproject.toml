[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dagelijkse-boekhouding"
version = "0.3.1"
description = "Lichte gezinsboekhouding: rekeningafschriften en facturen inlezen, categoriseren en rapporteren"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "streamlit>=1.50",
    "altair>=5",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "google-genai>=1.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# SDK's voor de andere AI-aanbieders (Mistral en OpenAI-compatibel werken via httpx)
ai = ["anthropic>=2.3", "openai>=3.0"]

[project.scripts]
boekhouding = "boekhouding.cli:main"

[tool.setuptools.packages.find]
include = ["boekhouding*"]

[tool.setuptools.package-data]
boekhouding = ["standaard/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
