# Standaardregels voor Belgische tegenpartijen.
# Enkel gebruikt om een NIEUWE database te vullen; daarna beheer je regels in de app of in Excel.
#
# veld:     alles | tegenpartij_naam | tegenpartij_iban | omschrijving | mededeling
#           ("alles" = tegenpartij + omschrijving + mededeling samen)
# patroon:  reguliere expressie, hoofdletter- en accentongevoelig
# teken:    beide | in | uit   (in = geld komt binnen, uit = geld gaat buiten)
# prioriteit: lager = eerst getest; de eerste regel die past wint
# categorie: "Hoofdcategorie / Subcategorie" zoals in categorieen.yaml

# --- Richting bepaalt de betekenis (prioriteit 50) ---------------------------------
- naam: Ziekenfonds terugbetaling
  patroon: '\b(mutualiteit|ziekenfonds|mutualite|helan|solidaris|partena ziekenfonds|onafhankelijk ziekenfonds|vnz|de voorzorg|christelijke mutualiteit|liberale mutualiteit)\b'
  teken: in
  prioriteit: 50
  categorie: Inkomsten / Terugbetalingen (ziekenfonds, verzekering)
- naam: Ziekenfonds lidgeld
  patroon: '\b(mutualiteit|ziekenfonds|mutualite|helan|solidaris|partena ziekenfonds|onafhankelijk ziekenfonds|vnz|de voorzorg|christelijke mutualiteit|liberale mutualiteit)\b'
  teken: uit
  prioriteit: 50
  categorie: Gezondheid / Ziekenfonds
- naam: Belastingteruggave
  patroon: '\b(fod financien|spf finances|federale overheidsdienst financien|belastingdienst)\b'
  teken: in
  prioriteit: 50
  categorie: Inkomsten / Belastingteruggave
- naam: Personenbelasting
  patroon: '\b(fod financien|spf finances|federale overheidsdienst financien|personenbelasting|aanslagbiljet|voorafbetaling)\b'
  teken: uit
  prioriteit: 50
  categorie: Financieel / Personenbelasting
- naam: Verkeersbelasting
  patroon: 'verkeersbelasting|taxe de circulation'
  prioriteit: 40
  categorie: Mobiliteit / Verkeersbelasting
- naam: Onroerende voorheffing
  patroon: 'onroerende voorheffing|precompte immobilier'
  prioriteit: 40
  categorie: Wonen / Onroerende voorheffing
- naam: Kindergeld
  patroon: 'groeipakket|kinderbijslag|kidslife|\binfino\b|myfamily|parentia|allocations familiales'
  teken: in
  prioriteit: 50
  categorie: Inkomsten / Kindergeld (Groeipakket)
- naam: Kindergeld FONS
  veld: tegenpartij_naam
  patroon: '^fons\b'
  teken: in
  prioriteit: 50
  categorie: Inkomsten / Kindergeld (Groeipakket)
- naam: Loon
  patroon: '\b(loon|salaris|wedde|salaire|bezoldiging|vakantiegeld|eindejaarspremie|dertiende maand)\b'
  teken: in
  prioriteit: 60
  categorie: Inkomsten / Loon en vergoedingen
- naam: Interesten
  patroon: '\b(interest|interesten|basisrente|getrouwheidspremie|aangroeipremie|dividend)\b'
  teken: in
  prioriteit: 60
  categorie: Inkomsten / Interesten en dividenden
- naam: Bankkosten
  patroon: 'beheerskosten|bankkosten|kosten rekening|kaartbijdrage|aanrekening kosten|frais de gestion|maandelijkse bijdrage|jaarlijkse bijdrage|kosten verrichtingen|pluspakket|plus-rekening|kosten zichtrekening|bijdrage zichtrekening|beheren vd rek|performance pack|essential pack'
  teken: uit
  prioriteit: 60
  categorie: Financieel / Bankkosten
- naam: Kredietkaartafrekening
  # Telt als uitgave zolang de afrekening zelf niet ingelezen is; daarna wordt het een interne overboeking.
  patroon: 'afrekening.{0,20}(kredietkaart|credit ?card|mastercard|visa)|(kredietkaart|mastercard|visa).{0,20}(afrekening|uitgavenstaat)|uitgaven visa kredietkaart|\bbcc - crelan\b|\bvisa ref \d'
  teken: uit
  prioriteit: 60
  categorie: Diversen / Kredietkaart (zonder detail)
- naam: Cash afhaling
  patroon: 'geldopneming|geldopname|cash ?afhaling|retrait|geldautomaat|\batm\b'
  teken: uit
  prioriteit: 60
  categorie: Diversen / Cash afhaling
- naam: Hypotheek
  patroon: 'hypothe|woonkrediet|woonlening|aflossing krediet|pret hypothecaire|credit logement'
  teken: uit
  prioriteit: 60
  categorie: Wonen / Hypotheek of huur
- naam: Huur
  patroon: '\b(huur|huurgeld|loyer)\b'
  teken: uit
  prioriteit: 150
  categorie: Wonen / Hypotheek of huur

